<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            color: #4CAF50;
        }

        .container {
            width: 80%;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        form {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="number"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        .btn-delete {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background-color: #e53935;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .employee-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .employee-row div {
            flex: 1;
        }

        .error-message {
            color: red;
            font-weight: bold;
        }

        .key-cell {
            cursor: pointer;
            color: #007bff;
            text-decoration: underline;
        }

        /* Mới thêm */
        .search-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-container input[type="text"] {
            width: 30%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .search-container h2 {
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Trang Quản Trị Admin</h1>
    <div class="container">
        <!-- Form thêm nhân viên -->
        <h2>Thêm Nhân Viên</h2>
        <form action="#" method="POST" onsubmit="return addEmployee(event)">
            <label for="name">Tên Nhân Viên:</label>
            <input type="text" id="name" name="name" required><br>

            <label for="key">Key:</label>
            <input type="text" id="key" name="key" required><br>

            <input type="submit" value="Thêm Nhân Viên">
        </form>
        <p id="errorMessage" class="error-message" style="display:none;"></p>

        <!-- Tìm kiếm và danh sách -->
        <div class="search-container">
            <h2>Danh Sách Nhân Viên</h2>
            <input type="text" id="search" oninput="searchEmployee()" placeholder="Tìm theo tên, key hoặc ngày tạo">
        </div>

        <!-- Danh sách nhân viên -->
        <table id="employeeList">
            <tr>
                <th>ID</th>
                <th>Tên Nhân Viên</th>
                <th>Key</th>
                <th>Ngày Tạo Key</th>
                <th>Hành Động</th>
            </tr>
            <!-- Các nhân viên sẽ được hiển thị tại đây -->
        </table>
    </div>

    <script>
        // Lấy danh sách nhân viên từ localStorage nếu có
        let employees = JSON.parse(localStorage.getItem('employees')) || [];

        // Hàm thêm nhân viên
        function addEmployee(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const key = document.getElementById('key').value;

            // Kiểm tra xem key đã tồn tại chưa
            if (employees.some(employee => employee.key === key)) {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').innerText = 'Key này đã tồn tại, vui lòng chọn key khác.';
                return false; // Không thêm nhân viên nếu key trùng
            }

            const id = employees.length + 1; // Tự động tạo ID dựa trên số lượng nhân viên
            const creationDate = new Date().toLocaleString(); // Lấy ngày giờ hiện tại
            const newEmployee = { id, name, key, creationDate };
            employees.push(newEmployee);
            document.getElementById('errorMessage').style.display = 'none'; // Ẩn thông báo lỗi
            localStorage.setItem('employees', JSON.stringify(employees)); // Lưu vào localStorage
            displayEmployees();
            return true;
        }

        // Hàm hiển thị danh sách nhân viên
        function displayEmployees() {
            const employeeList = document.getElementById('employeeList');
            employeeList.innerHTML = `
                <tr>
                    <th>ID</th>
                    <th>Tên Nhân Viên</th>
                    <th>Key</th>
                    <th>Ngày Tạo Key</th>
                    <th>Hành Động</th>
                </tr>
            `;
            employees.forEach(employee => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${employee.id}</td>
                    <td>${employee.name}</td>
                    <td class="key-cell" onclick="copyKey('${employee.key}')">${employee.key}</td>
                    <td>${employee.creationDate}</td>
                    <td class="action-btns">
                        <button class="btn-delete" onclick="removeEmployee(${employee.id})">Xóa</button>
                    </td>
                `;
                employeeList.appendChild(row);
            });
        }

        // Hàm xóa nhân viên từ bảng
        function removeEmployee(id) {
            employees = employees.filter(employee => employee.id !== id);
            localStorage.setItem('employees', JSON.stringify(employees)); // Lưu lại vào localStorage
            displayEmployees();
        }

        // Hàm sao chép key
        function copyKey(key) {
            const textArea = document.createElement('textarea');
            textArea.value = key;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            alert('Key đã được sao chép vào clipboard!');
        }

        // Hàm tìm kiếm nhân viên
        function searchEmployee() {
            const searchQuery = document.getElementById('search').value.toLowerCase();
            const filteredEmployees = employees.filter(employee => 
                employee.name.toLowerCase().includes(searchQuery) ||
                employee.key.toLowerCase().includes(searchQuery) ||
                employee.creationDate.toLowerCase().includes(searchQuery)
            );
            displayFilteredEmployees(filteredEmployees);
        }

        // Hàm hiển thị danh sách nhân viên sau khi lọc
        function displayFilteredEmployees(filteredEmployees) {
            const employeeList = document.getElementById('employeeList');
            employeeList.innerHTML = `
                <tr>
                    <th>ID</th>
                    <th>Tên Nhân Viên</th>
                    <th>Key</th>
                    <th>Ngày Tạo Key</th>
                    <th>Hành Động</th>
                </tr>
            `;
            filteredEmployees.forEach(employee => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${employee.id}</td>
                    <td>${employee.name}</td>
                    <td class="key-cell" onclick="copyKey('${employee.key}')">${employee.key}</td>
                    <td>${employee.creationDate}</td>
                    <td class="action-btns">
                        <button class="btn-delete" onclick="removeEmployee(${employee.id})">Xóa</button>
                    </td>
                `;
                employeeList.appendChild(row);
            });
        }

        // Hiển thị danh sách nhân viên khi trang được tải
        window.onload = displayEmployees;
    </script>
</body>
</html>
